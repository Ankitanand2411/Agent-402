# Render blueprint for the marketplace backend.
# Secrets (sync: false) are set once in the Render dashboard and never committed.
services:
  - type: web
    name: agent402-backend
    runtime: python
    rootDir: MarketplaceBackend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ESCROW_CONTRACT_ADDRESS
        sync: false
      - key: ESCROW_PRIVATE_KEY
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: SETTLEMENT_MODE
        value: async
      - key: DAILY_SPEND_CAP_UNITS
        value: "0"
      - key: REQUIRE_PROVIDER_SIGNATURE
        value: "false"
      - key: TOOL_RETRIEVAL_TOP_K
        value: "8"
