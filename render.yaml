# Render blueprint for the marketplace backend.
# Secrets (sync: false) are set once in the Render dashboard and never committed.
services:
  - type: web
    name: agent402-backend
    runtime: python
    rootDir: MarketplaceBackend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ESCROW_CONTRACT_ADDRESS
        sync: false
      - key: ESCROW_PRIVATE_KEY
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: SETTLEMENT_MODE
        value: async
      - key: DAILY_SPEND_CAP_UNITS
        value: "0"
      - key: REQUIRE_PROVIDER_SIGNATURE
        value: "false"
      - key: TOOL_RETRIEVAL_TOP_K
        value: "8"
      - key: MCP_ENABLED
        value: "true"
      - key: AGENT_CHECKPOINT_DB
        value: agent_checkpoints
      - key: TOOL_ENV_ALLOWLIST
        value: "GROQ_API_KEY,ADZUNA_APP_ID,ADZUNA_APP_KEY"
      - key: ALLOW_INSECURE_TOOL_URLS
        value: "false"
