name: frontend-ci

# Lint + production build for the React frontend. Runs on every push/PR (no
# path filter) so it can be a required status check.
on: [push, pull_request]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgentPayFrontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AgentPayFrontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
