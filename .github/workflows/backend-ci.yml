name: backend-ci

# Lint + tests for the FastAPI marketplace backend on every push/PR (no path
# filter, so it can be a required status check).
# No secrets needed: MongoDB, the Sepolia RPC, Gemini and escrow settlement are
# all replaced with in-process fakes in MarketplaceBackend/tests.
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MarketplaceBackend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            MarketplaceBackend/requirements.txt
            MarketplaceBackend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q
